name: Build apps

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r windows/requirements.txt pyinstaller
      - run: pyinstaller --onefile --noconsole --name WLED-Ambilight windows/ambilight.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/WLED-Ambilight.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle -p android assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk WLED-Ambilight-AndroidTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: WLED-Ambilight-AndroidTV.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: WLED Ambilight v1.0.${{ github.run_number }}
          body: |
            - **WLED-Ambilight.exe**: Windows app (just double-click)
            - **WLED-Ambilight-AndroidTV.apk**: Android TV app (sideload)
          files: |
            out/WLED-Ambilight.exe
            out/WLED-Ambilight-AndroidTV.apk
